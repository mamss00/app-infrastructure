name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - '**.tf'
      - '**.hcl'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches:
      - dev
      - prod
    paths:
      - '**.tf'
      - '**.hcl'
      - '**.yml'
      - '**.yaml'
  workflow_dispatch:  # Ajout du déclencheur manuel

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Debug - Check directory structure  # ✅ Vérifier la présence des dossiers
        run: ls -R

      - name: Install Terraform & Terragrunt Properly  # ✅ Installation propre
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -L -o terraform.zip https://releases.hashicorp.com/terraform/1.5.5/terraform_1.5.5_linux_amd64.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/
          terraform --version
          terragrunt --version

      # Environnement DEV
      - name: Terraform Plan (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          if [ -d "environments/dev" ]; then cd environments/dev && terragrunt run-all plan --terragrunt-config root.hcl; else echo "❌ ERROR: Directory environments/dev not found!"; exit 1; fi

      - name: Terraform Apply (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          if [ -d "environments/dev" ]; then cd environments/dev && terragrunt run-all apply --terragrunt-config root.hcl -auto-approve; else echo "❌ ERROR: Directory environments/dev not found!"; exit 1; fi

      # Environnement PROD - Plan uniquement
      - name: Terraform Plan (Prod)
        if: github.ref == 'refs/heads/prod'
        run: |
          if [ -d "environments/prod" ]; then cd environments/prod && terragrunt run-all plan --terragrunt-config root.hcl; else echo "❌ ERROR: Directory environments/prod not found!"; exit 1; fi

  deploy_prod:
    name: "Apply Prod (Manual Approval)"
    needs: terraform
    runs-on: ubuntu-latest
    environment: production  # ✅ Demande une validation manuelle avant d'exécuter
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Terragrunt
        run: |
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terraform Apply (Prod - Requires Approval)
        run: |
          if [ -d "environments/prod" ]; then cd environments/prod && terragrunt run-all apply --terragrunt-config root.hcl -auto-approve; else echo "❌ ERROR: Directory environments/prod not found!"; exit 1; fi
