name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - '**.tf'
      - '**.hcl'
  pull_request:
    branches:
      - dev
      - prod
    paths:
      - '**.tf'
      - '**.hcl'
  workflow_dispatch:  # Ajout du déclencheur manuel

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Debug - List files  # ✅ Vérifier si environments/dev et environments/prod existent
        run: ls -R

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Install Terragrunt
        run: |
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      # Environnement DEV
      - name: Terraform Plan (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          cd dev
          terragrunt plan

      - name: Terraform Apply (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          cd dev
          terragrunt apply -auto-approve

      # Environnement PROD - Plan uniquement
      - name: Terraform Plan (Prod)
        if: github.ref == 'refs/heads/prod'
        run: |
          cd prod
          terragrunt plan

  deploy_prod:
    name: "Apply Prod (Manual Approval)"
    needs: terraform
    runs-on: ubuntu-latest
    environment: production  # ✅ Demande une validation manuelle avant d'exécuter
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Terragrunt
        run: |
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terraform Apply (Prod - Requires Approval)
        run: |
          cd prod
          terragrunt apply -auto-approve
